name: CI

on:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev python3

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFLOWHUB_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build project
        run: cmake --build build --target flowhub -j $(nproc)

      - name: Build unit tests
        run: cmake --build build --target flowhub_ut -j $(nproc)

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure -L flowhub
